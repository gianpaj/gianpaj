<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Window -->
  <rect x="8" y="8" width="984" height="274" rx="18" fill="#141414" stroke="#2e2e2e" stroke-width="2" />

  <!-- Terminal title bar -->
  <rect x="8" y="8" width="984" height="48" rx="18" fill="#1e1e1e" />

  <rect x="8" y="40" width="984" height="16" fill="#1e1e1e" />

  <!-- Window buttons -->
  <circle cx="36" cy="32" r="7" fill="#ff5f56" />
  <circle cx="60" cy="32" r="7" fill="#ffbd2e" />
  <circle cx="84" cy="32" r="7" fill="#27c93f" />

  <text x="500" y="37" text-anchor="middle" font-family="monospace" font-size="14" fill="#9ca3af">
    gianpaj@github: ~
  </text>

  <!-- Prompt -->
  <text x="55" y="103" font-family="monospace" font-size="18" fill="#d4785e">
    gianpaj@github:~$
  </text>

  <text x="252" y="103" font-family="monospace" font-size="18" fill="#e8e4de">
    ./whoami
  </text>

  <!-- Name -->
  <text x="55" y="163" font-family="monospace" font-size="46" font-weight="700" fill="#d4785e" filter="url(#glow)">
    GIANFRANCO
  </text>

  <!-- Tagline -->
  <text x="57" y="205" font-family="monospace" font-size="20" fill="#e8e4de">
    Builder. Tinkerer. Dog father.
  </text>

  <!-- Secondary -->
  <text x="57" y="242" font-family="monospace" font-size="15" fill="#9ca3af">
    TypeScript · React · Python · Voice AI · Madrid
  </text>

  <!-- Cursor -->
  <rect x="494" y="226" width="10" height="20" rx="1" fill="#d4785e">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
  </rect>

</svg>
